# Archive.org items and collections listed by the built-in "Archive.org (curated)" source.
#
# An entry belongs here only when its archive.org metadata clearly shows the games are
# homebrew, public-domain or freeware released by their authors: the author's own upload,
# or an explicit licence such as MIT, GPL, CC or public domain. Anything containing
# commercial titles, ROM sets or uploads without a clear rights statement is left out.
#
# Each entry: identifier, default platform, a one-line note saying who uploaded it and why
# it qualifies, an optional `exclude` list of file names that are not playable (source or
# asset archives), and optional per-item platform overrides (item identifier = platform key).

[[collection]]
identifier = "TobuTobuGirlGame"
platform = "gb"
note = "Tobu Tobu Girl by Tangram Games, uploaded by Alex Gleason; open-source homebrew, code MIT and assets CC-BY-SA-4.0 per the description."
exclude = ["sourcecode.zip"]

[[collection]]
