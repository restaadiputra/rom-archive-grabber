[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rom-archive-grabber"
version = "0.1.0"
description = "Terminal app to browse and download game files from archives you choose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "restaadiputra" }]
keywords = ["tui", "downloader", "archive", "homebrew"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.11"
dependencies = ["textual", "httpx", "platformdirs", "tomli-w"]

[project.urls]
Homepage = "https://github.com/restaadiputra/rom-archive-grabber"
Issues = "https://github.com/restaadiputra/rom-archive-grabber/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[project.scripts]
rom-archive-grabber = "rom_archive_grabber.composition:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rom_archive_grabber"]
include = ["src/rom_archive_grabber/data/*.toml", "src/rom_archive_grabber/ui/*.tcss"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# ruff counts `self` here, so 4 keeps the effective limit at 3 parameters.
max-args = 4

[tool.ruff.lint.per-file-ignores]
# Magic numbers in assertions are the point of a test.
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
